<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Zwart op Wit — Internal Competition</title>
    <!--
      Static defaults for every route. A shared round permalink
      (/round/:number) gets these swapped for round-specific values —
      including og:image pointing at that round's pre-rendered share image
      — server-side in server.mjs, before this file is served; see
      renderIndexHtml there. This is a plain client-rendered SPA (no SSR),
      so link-preview crawlers (which don't run JS) only ever see whatever
      HTML this file resolves to for the request path they fetched.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zwart op Wit" />
    <meta property="og:title" content="Zwart op Wit — Internal Competition" />
    <meta property="og:description" content="Internal chess competition site — leaderboard, rounds, and pairings." />
    <meta property="og:image" content="__OG_IMAGE__" />
    <meta property="og:url" content="__OG_URL__" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Only counts real visits to the production site — staging and
      // production build from the same index.html, so an unconditional
      // script tag here would also count every staging deploy check
      // against the club's real analytics.
      (function () {
        var host = window.location.hostname;
        var isProd = host === 'zwartopwit.up.railway.app' || host === 'internal.zwartopwit.org';
        if (!isProd) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = '//gc.zgo.at/count.js';
        s.setAttribute('data-goatcounter', 'https://zwartopwit.goatcounter.com/count');
        document.head.appendChild(s);
      })();
    </script>
    <script>
      // Applied before React mounts (and before first paint) so there's no
      // flash of the wrong theme — ThemeContext just reads this back. An
      // explicit stored choice (from the toggle) always wins; absent that,
      // follow the OS/browser's own light-vs-dark preference.
      (function () {
        var stored = localStorage.getItem('zow:theme');
        var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        var light = stored ? stored === 'light' : prefersLight;
        if (light) document.documentElement.dataset.theme = 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
