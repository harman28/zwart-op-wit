name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zwart_op_wit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zwart_op_wit_test
      SESSION_SECRET: ci-only-secret-not-used-for-anything-real
      ADMIN_INITIAL_PASSWORD: ci-test-password
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Push schema to the ephemeral CI database
        run: npm run db:push --workspace server

      - name: Lint (engine isolation rule lives here)
        run: npm run lint --workspace server

      - name: Typecheck server
        working-directory: server
        run: npx tsc -p tsconfig.json --noEmit

      - name: Typecheck web
        working-directory: web
        run: npx tsc -b --noEmit

      - name: Server test suite (engine + integration)
        run: npm test --workspace server

      - name: Build web
        run: npm run build --workspace web
